# Local k3s Fleet for Phase 1 (docs/phase-1.md, Part E). Phase 3 replaces
# this with a Helm chart.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: ground-trace
spec:
  replicas: 1
  template:
    spec:
      ports:
        - name: default
          portPolicy: Dynamic      # random host port in 7000-8000
          containerPort: 7777      # what NetworkBootstrapUI listens on (GAME_PORT)
          protocol: UDP
      health:
        # Default is 5s. A Unity server takes a few seconds to boot before it
        # can send its first health ping; don't let a slow start read as dead.
        initialDelaySeconds: 30
      template:
        spec:
          containers:
            - name: game-server
              # Imported with `k3s ctr images import`, not pushed anywhere.
              # A new tag per build: :latest makes Kubernetes always pull,
              # which fails with ErrImagePull even though the image is local.
              image: game-server:dev2
              imagePullPolicy: IfNotPresent
              env:
                - name: ORCHESTRATOR
                  value: agones
                - name: EMPTY_SHUTDOWN_SECONDS
                  value: "60"
                # Where SessionHeartbeat reports once the server is allocated,
                # which is what lets the matchmaker backfill into it. This is
                # serve_local.py on the node, which must then listen on more
                # than 127.0.0.1 (--host 0.0.0.0): the pod's loopback is its
                # own, not the node's.
                - name: MATCHMAKER_URL
                  value: http://10.0.0.55:8080
                - name: MATCHMAKER_KEY
                  value: local-dev-key
