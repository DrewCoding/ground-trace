# Agones install settings for EKS (Phase 5), on top of values-certs.yaml.
# Not yet installed anywhere - values here follow docs/phase-5.md and get
# checked when that cluster exists.
agones:
  ping:
    install: false

  crds:
    # Same as local: deleting the Application must not take every
    # GameServer's CRD with it. On EKS the whole cluster is destroyed after
    # a window anyway, so this only matters mid-window.
    cleanupOnDelete: false

  # Default replica counts: unlike the single local node, a multi-node
  # cluster gets real availability from them.

  # Agones' system pods prefer nodes labelled agones.dev/agones-system=true
  # and tolerate that taint by default. Requiring it keeps them off the game
  # server nodes, where they'd compete with matches for CPU. Phase 5 creates
  # the labelled, tainted system node group.
  requireDedicatedNodes: true

  # The allocator's server certificate (the allocator-tls Secret) must name
  # its load balancer's hostname, which doesn't exist until the cluster does.
  # The EKS bootstrap waits for it and issues the certificate from the same
  # CA as local (docs/phase-2.md), so the matchmaker's trusted CA never
  # changes - only agones_allocator_url does, once per window.

# Must match the game server security group's UDP rule.
gameservers:
  minPort: 7000
  maxPort: 8000
