# Agones install settings for the local k3s cluster, deployed by Argo CD
# (infrastructure/k8s/argocd/local/agones.yaml).

agones:
  # Player latency measurement for multi-region placement. One local cluster
  # has nothing to choose between.
  ping:
    install: false

  crds:
    # The pre-delete hook that deletes Agones' CRDs on uninstall would take
    # every GameServer with them. Removing Agones should be a deliberate act,
    # not a side effect of deleting an Argo CD Application.
    cleanupOnDelete: false

  # One of each instead of 2/2/3. On a single node extra replicas add no
  # availability, and the controller and extensions each reserve ~10GB of
  # ephemeral storage - two of each nearly filled the 44GB root disk.
  controller:
    replicas: 1
    # PUBLIC CERTIFICATE \/\/\/\/\/\/
    generateTLS: false
    disableSecret: true
    tlsCert: |
