apiVersion: v1
kind: Pod
metadata:
  name: game-server
  labels:
    app: game-server
spec:
  containers:
  - name: game-server
    image: game-server:dev1
    imagePullPolicy: Never
    ports:
    - containerPort: 7777
      protocol: UDP
    # I made security Unconfined due to AppArmor blocking signals from its own thread
    # Since it's local-only, EKS doesn't use it. All good.
    securityContext:
      appArmorProfile:
        type: Unconfined
  restartPolicy: Never