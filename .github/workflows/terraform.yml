name: Terraform

on:
  pull_request:
    paths: ["infrastructure/**"]
  push:
    branches: [main]
    paths: ["infrastructure/**"]
  workflow_dispatch:

# id-token: write is what lets the job request an OIDC token. Without it the
# credentials step fails with a confusing "Not authorized to perform
# sts:AssumeRoleWithWebIdentity" - the token never gets issued at all.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-west-1
  TF_WORKING_DIR: infrastructure/aws

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      # No stored access keys. This exchanges the workflow's OIDC token for
      # short-lived credentials via the role's trust policy.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_matchmaker_api_key: ${{ secrets.MATCHMAKER_API_KEY }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', {
              cwd: '${{ env.TF_WORKING_DIR }}',
              maxBuffer: 10 * 1024 * 1024,
            }).toString();

            // PR comments cap at 65536 characters.
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n...truncated, see the job log.'
              : plan;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan\n```hcl\n' + body + '\n```',
            });

      # Applies only from main. A pull request can see what would change but
      # cannot change it.
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_matchmaker_api_key: ${{ secrets.MATCHMAKER_API_KEY }}
